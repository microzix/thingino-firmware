name: Build T8410X USB-safe diagnostic firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    env:
      BOARD: eufy_t8410x_t31x_sc3335_syn4343
      BR2_DL_DIR: ${{ github.workspace }}/dl

    steps:
      - name: Checkout Thingino ciao source
        uses: actions/checkout@v5
        with:
          repository: themactep/thingino-firmware
          ref: ciao
          submodules: recursive

      - name: Add diagnostic kernel patch from this fork
        shell: bash
        run: |
          set -eux
          git fetch --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_REF_NAME}"

          git show \
            FETCH_HEAD:package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch \
            > package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch

          grep -n 'trace:' \
            package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch

      - name: Configure safe Wi-Fi diagnostic build
        shell: bash
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          board = Path("configs/cameras/eufy_t8410x_t31x_sc3335_syn4343_defconfig")
          text = board.read_text()

          text = text.replace(
              "gpio_wl_reg_on=48 gpio_wl_host_wake=39",
              "gpio_wl_reg_on=48 gpio_wl_host_wake=39 retry_max_count=0",
          )

          board.write_text(text)
          PY

          # USB-NCM maradjon aktív; Wi-Fi ne induljon automatikusan.
          sed -i \
            's|^[[:space:]]*modprobe bcmdhd|# modprobe bcmdhd|' \
            package/base-files/files/etc/init.d/S36wifi || true

          grep -R -n \
            'gpio_wl_reg_on=48\|gpio_wl_host_wake=39\|retry_max_count=0' \
            configs/cameras/eufy_t8410x_t31x_sc3335_syn4343_defconfig

      - name: Build firmware inside Thingino container
        shell: bash
        run: |
          set -eux

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BOARD="${BOARD}" \
            -e BR2_DL_DIR=/work/dl \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e WORKFLOW=1 \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/themactep/thingino-builder-image:latest \
            sh -lc 'make fast WORKFLOW=1'

      - name: Verify diagnostic MMC module
        shell: bash
        run: |
          set -eux

          module="$(find output -path '*jzmmc_v12.ko' -type f | head -n 1)"
          test -n "${module}"

          echo "Checking ${module}"
          strings "${module}" | grep 'trace:'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: thingino-t8410x-sc3335-usb-safe-diagnostic
          path: |
            output/**/*.bin
            output/**/*.img
          if-no-files-found: error
          if marker not in source:
              needle = 'start() {\n\techo -c 15 "Starting wireless interface"\n'
              replacement = (
                  needle
                  + f'\n\techo "{marker}"\n'
                  + '\techo "Use USB-NCM and load bcmdhd manually only when instructed."\n'
                  + '\treturn 0\n'
              )
              if needle not in source:
                  raise SystemExit("Unable to locate wireless start function")
              path.write_text(source.replace(needle, replacement, 1))
          PY

          python3 - "$WIFI_MK" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "WIFI_SYN4343_T8410X_SAFE_DIAG_PATCH"

          if marker not in source:
              hook = "\n".join([
                  "",
                  "# Keep failed Wi-Fi probes to one power-up attempt.",
                  "define WIFI_SYN4343_T8410X_SAFE_DIAG_PATCH",
                  "\t$(SED) 's/int retry = POWERUP_MAX_RETRY;/int retry = 0;/g' $(@D)/dhd_linux.c",
                  "\t$(SED) 's/int retry = POWERUP_MAX_RETRY;/int retry = 0;/g' $(@D)/dhd_linux_platdev.c",
                  "endef",
                  "",
                  "WIFI_SYN4343_POST_PATCH_HOOKS += WIFI_SYN4343_T8410X_SAFE_DIAG_PATCH",
                  "",
              ])
              anchor = "define WIFI_SYN4343_LINUX_CONFIG_FIXUPS\n"
              if anchor not in source:
                  raise SystemExit("Unable to locate SYN4343 patch anchor")
              path.write_text(source.replace(anchor, hook + "\n" + anchor, 1))
          PY

          grep -E 'SENSOR_1_NAME|DWC2|USBNET' "$CFG"
          grep -n 'Automatic WLAN start disabled' "$WIFI_INIT"
          grep -F 'gpio_wl_host_wake=39' "$WIFI_MK"

      - name: Build firmware
        run: |
          BOARD="$BOARD" make fast WORKFLOW=1

      - name: Verify compiled MMC diagnostic patch
        run: |
          set -eu
          MODULE="$(find output -type f -name jzmmc_v12.ko -print -quit)"
          test -n "$MODULE"
          strings "$MODULE" | grep -F 'trace: request'
          strings "$MODULE" | grep -F 'trace: manual insert'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: thingino-t8410x-sc3335-usb-diagnostic
          path: output/**/images/thingino-eufy_t8410x_t31x_sc3335_syn4343.bin
          if-no-files-found: error
