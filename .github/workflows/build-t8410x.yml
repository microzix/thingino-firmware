name: Build T8410X USB-safe diagnostic firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    env:
      BOARD: eufy_t8410x_t31x_sc3335_syn4343
      BR2_DL_DIR: ${{ github.workspace }}/dl

    steps:
      - name: Checkout Thingino ciao source
        uses: actions/checkout@v5
        with:
          repository: themactep/thingino-firmware
          ref: ciao
          submodules: recursive

      - name: Add diagnostic kernel patch from this fork
        shell: bash
        run: |
          set -eux

          git fetch --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_REF_NAME}"

          git show \
            FETCH_HEAD:package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch \
            > package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch

          grep -n 'trace:' \
            package/all-patches/linux/3.10.14/0010-jzmmc-trace-sdio-probe.patch

      - name: Verify selected camera configuration
        shell: bash
        run: |
          set -eux

          test -f \
            "configs/cameras/${BOARD}/${BOARD}_defconfig"

          grep -n \
            'BR2_PACKAGE_WIFI_SYN4343=y' \
            "configs/cameras/${BOARD}/${BOARD}_defconfig"

          grep -n \
            'gpio_wl_reg_on=48 gpio_wl_host_wake=39' \
            package/wifi-syn4343/wifi-syn4343.mk

      - name: Build firmware inside Thingino container
        shell: bash
        run: |
          set -eux

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BOARD="${BOARD}" \
            -e BR2_DL_DIR=/work/dl \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e WORKFLOW=1 \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/themactep/thingino-builder-image:latest \
            sh -lc 'BOARD="${BOARD}" make fast WORKFLOW=1'

      - name: Verify diagnostic MMC module
        shell: bash
        run: |
          set -eux

          module="$(find output -path '*jzmmc_v12.ko' -type f | head -n 1)"
          test -n "${module}"

          echo "Checking ${module}"
          strings "${module}" | grep 'trace:'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: thingino-t8410x-sc3335-usb-safe-diagnostic
          path: |
            output/**/*.bin
            output/**/*.img
          if-no-files-found: error
